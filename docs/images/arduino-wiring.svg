<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>Mega 2560 · connection schedule</title><desc>Functional wiring plan — not a breadboard placement or physical transistor pinout</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#172b3a"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="820" fill="#fff" stroke="#fff" stroke-width="1.5"/><rect x="20" y="20" width="1160" height="780" fill="white" stroke="#172b3a" stroke-width="1.5"/><text x="48" y="62" font-size="28" fill="#172b3a" text-anchor="start">Mega 2560 · connection schedule</text><text x="48" y="91" font-size="16" fill="#172b3a" text-anchor="start">Functional wiring plan — not a breadboard placement or physical transistor pinout</text><polyline points="20,113 1180,113" fill="none" stroke="#172b3a" stroke-width="1"/><polyline points="20,745 1180,745" fill="none" stroke="#172b3a" stroke-width="1"/><text x="48" y="775" font-size="16" fill="#172b3a" text-anchor="start">INTERACTIVE PROJECTION GUESS WHO</text><text x="1152" y="775" font-size="14" fill="#172b3a" text-anchor="end">EE-02  /  REV B  /  DOCUMENTATION</text><rect x="55" y="155" width="255" height="295" fill="#f7f9fa" stroke="#172b3a" stroke-width="1.5"/><text x="75" y="189" font-size="20" fill="#172b3a" text-anchor="start">ELEGOO MEGA 2560</text><text x="75" y="216" font-size="16" fill="#172b3a" text-anchor="start">Relevant connections only</text><text x="280" y="258" font-size="18" fill="#172b3a" text-anchor="end">5V</text><text x="280" y="318" font-size="18" fill="#172b3a" text-anchor="end">D8</text><text x="280" y="378" font-size="18" fill="#172b3a" text-anchor="end">GND</text><text x="75" y="430" font-size="16" fill="#172b3a" text-anchor="start">D13 LED is onboard</text><polyline points="55,235 35,235 35,510 310,510" fill="none" stroke="#172b3a" stroke-width="2"/><text x="65" y="493" font-size="15" fill="#172b3a" text-anchor="start">Laptop USB → board USB socket</text><polyline points="310,270 380,270 380,190 650,190" fill="none" stroke="#b53c35" stroke-width="3"/><text x="400" y="176" font-size="16" fill="#b53c35" text-anchor="start">+5V</text><rect x="650" y="160" width="470" height="65" fill="white" stroke="#172b3a" stroke-width="1.5"/><text x="675" y="186" font-size="19" fill="#172b3a" text-anchor="start">BZ1 +     /     D1 cathode K (band)</text><text x="675" y="211" font-size="14" fill="#b53c35" text-anchor="start">Red supply net</text><polyline points="310,330 360,330" fill="none" stroke="#007d8a" stroke-width="3"/><rect x="360" y="318" width="100" height="24" fill="#f3e6ca" stroke="#172b3a" stroke-width="1.5"/><text x="360" y="306" font-size="16" fill="#172b3a" text-anchor="start">R1 · 470 Ω</text><polyline points="460,330 650,330" fill="none" stroke="#007d8a" stroke-width="3"/><rect x="650" y="300" width="470" height="65" fill="white" stroke="#172b3a" stroke-width="1.5"/><text x="675" y="328" font-size="19" fill="#172b3a" text-anchor="start">Q1 base B     /     R2 first end</text><text x="675" y="352" font-size="14" fill="#007d8a" text-anchor="start">Teal control net · after R1</text><polyline points="310,390 380,390 380,470 650,470" fill="none" stroke="#172b3a" stroke-width="3"/><rect x="650" y="440" width="470" height="65" fill="white" stroke="#172b3a" stroke-width="1.5"/><text x="675" y="468" font-size="19" fill="#172b3a" text-anchor="start">Q1 emitter E     /     R2 second end</text><text x="675" y="492" font-size="14" fill="#172b3a" text-anchor="start">Common GND · R2 = 10 kΩ from B to E</text><polyline points="595,580 650,580" fill="none" stroke="#76549a" stroke-width="3"/><rect x="650" y="550" width="470" height="65" fill="white" stroke="#172b3a" stroke-width="1.5"/><text x="675" y="578" font-size="18" fill="#172b3a" text-anchor="start">Q1 collector C / BZ1 − / D1 anode A</text><text x="675" y="602" font-size="14" fill="#76549a" text-anchor="start">Purple switched return · unbanded diode end</text><text x="55" y="570" font-size="18" fill="#172b3a" text-anchor="start">D1 = 1N4007, across the buzzer.</text><text x="55" y="600" font-size="18" fill="#172b3a" text-anchor="start">Follow identified buzzer polarity.</text><text x="55" y="650" font-size="16" fill="#172b3a" text-anchor="start">E / B / C denote circuit functions. Retain the owner-tested transistor wiring pattern.</text><text x="55" y="681" font-size="18" fill="#b53c35" text-anchor="start">WORKING CIRCUIT — USER TESTED</text><text x="55" y="710" font-size="15" fill="#172b3a" text-anchor="start">USB powers the Mega. Disconnect power before changing circuit connections.</text></g></svg>
